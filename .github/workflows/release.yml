name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: v<package.json version>)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Pack npm tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          (cd dist && sha256sum *.tgz > SHA256SUMS.txt)

      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          REL_REF_TYPE: ${{ github.ref_type }}
          REL_REF_NAME: ${{ github.ref_name }}
          REL_INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$REL_REF_TYPE" == "tag" ]]; then
            TAG="$REL_REF_NAME"
          elif [[ -n "$REL_INPUT_TAG" ]]; then
            TAG="$REL_INPUT_TAG"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.tgz
            dist/SHA256SUMS.txt
